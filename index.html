<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern Road">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#0f1016}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lantern Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen night-road app. Status strip, scene (map or battle) in the middle, hand docked at the bottom. Single committed dark look. */
:root{
  color-scheme:dark;
  --ink:#0f1016;--paper:#1a1b24;--paper2:#232431;--line:#2e2f3e;--line2:#3d3e52;
  --washi:#ece6d7;--dim:#9a96a8;--gold:#d6ad55;--indigo:#8a90ea;--ember:#e5743f;--jade:#62b89d;--blood:#d4504a;
  --f-disp:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--washi);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
#app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;padding-block:10px}
#bar{display:flex;gap:6px 10px;align-items:center;flex-wrap:nowrap;white-space:nowrap;font-size:12.5px;color:var(--dim);padding-bottom:8px;border-bottom:1px solid var(--line)}
#bar b{color:var(--washi);font-variant-numeric:tabular-nums;font-weight:700}
#bar .hp b{color:var(--blood)}#bar .gd b{color:var(--gold)}
#bar .sp{flex:1}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding-top:12px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed}
.btn{background:var(--paper2);border:1px solid var(--line2);border-radius:8px;padding:10px 16px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.main{background:var(--gold);color:#1c1508;border-color:var(--gold);font-weight:700}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;text-wrap:balance;margin:0}
h2{font-size:24px}h3{font-size:17px}
p{margin:0}
.muted{color:var(--dim)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* title */
.menu{flex:1;display:flex;flex-direction:column;gap:18px;padding-bottom:12px;min-height:100%}
.keyart{position:relative;height:clamp(210px,38vh,330px);flex:0 0 auto;border-radius:14px;overflow:hidden;margin-top:6px}
#bar[hidden]{display:none}
.keyart .bg{top:0;bottom:0;border-radius:0}
.trio{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;align-items:flex-end;gap:0}
.tk{width:min(26vw,120px);line-height:0;margin-inline:-6px;animation:rise .9s cubic-bezier(.2,.8,.3,1) backwards}
.tk svg{width:100%;height:auto;overflow:visible}
.tk.samurai{width:min(31vw,142px);z-index:2;animation-delay:.1s}.tk.wizard{transform:scaleX(-1);animation-delay:.25s}.tk.ninja{animation-delay:.35s}
.tk.wizard{animation-name:riseFlip}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes riseFlip{from{opacity:0;transform:scaleX(-1) translateY(24px)}to{transform:scaleX(-1)}}
.logo{display:flex;align-items:center;gap:16px;margin-top:-34px;position:relative;z-index:2;animation:rise .7s .2s cubic-bezier(.2,.8,.3,1) backwards}
.logo h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:.92;letter-spacing:.08em;text-transform:uppercase;color:var(--washi);text-shadow:0 3px 0 #0f1016,0 0 24px #d6ad5544}
.logo .tagline{margin-top:8px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.seal{flex:0 0 auto;font-family:var(--f-disp);font-weight:800;font-size:18px;line-height:1.05;color:#f3e3c2;background:#b0302a;padding:8px 9px;border-radius:4px;box-shadow:inset 0 0 0 2px #f3e3c233,0 4px 0 #5a1612;transform:rotate(-4deg)}
.mlist{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px}
.mi{--cut:12px;position:relative;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 18px 13px 16px;background:#191a24;color:var(--washi);border:0;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));box-shadow:inset 0 0 0 1px #3d3e52;transition:transform .15s,background .15s;animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards}
.mi:nth-child(1){animation-delay:.35s}.mi:nth-child(2){animation-delay:.42s}.mi:nth-child(3){animation-delay:.49s}.mi:nth-child(4){animation-delay:.56s}
.mi .ml{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mi b{font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.mi small{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .mk{width:8px;height:8px;background:var(--line2);transform:rotate(45deg);transition:background .15s,transform .15s}
.mi:hover,.mi:focus-visible{transform:translateX(6px);background:#22232f;outline:none;box-shadow:inset 0 0 0 1.5px var(--gold)}
.mi:hover .mk,.mi:focus-visible .mk{background:var(--gold);transform:rotate(45deg) scale(1.3)}
.mi.pri{background:var(--gold);color:#1c1508;box-shadow:none}
.mi.pri small{color:#4a3a14}.mi.pri .mk{background:#1c1508}
.mi.pri:hover,.mi.pri:focus-visible{background:#e3bd68;box-shadow:none}
.badge{font-size:12px;font-weight:700;color:var(--gold);border:1px solid #6f5418;background:#2e2614;border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.mfoot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
.title{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:20px}
.title .kan{font-family:var(--f-disp);font-size:clamp(64px,22vw,120px);line-height:.9;color:var(--gold);letter-spacing:.04em}
.title h1{font-size:clamp(30px,8vw,44px)}
.title .lamp{width:58px;height:78px;border-radius:26px;background:var(--gold);position:relative;animation:sway 4s ease-in-out infinite;transform-origin:50% -30px}
.title .lamp::before{content:"";position:absolute;inset:14px -2px;border-top:2px solid #1c1508;border-bottom:2px solid #1c1508}
.title .lamp::after{content:"";position:absolute;left:27px;top:-30px;width:2px;height:30px;background:var(--dim)}
@keyframes sway{50%{transform:rotate(5deg)}}

/* map */
.trail{display:flex;gap:4px;align-items:center}
.trail i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.trail i.done{background:var(--gold)}.trail i.now{background:var(--indigo)}
.trail i.boss{flex:0 0 14px;height:14px;border-radius:50%;background:var(--line2)}
.paths{display:grid;gap:10px}
.path{display:flex;gap:14px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:14px}
.path:hover{border-color:var(--gold)}
.sig{flex:0 0 52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;background:var(--paper2);border:1px solid var(--line2)}
.path.elite .sig,.path.boss .sig{color:var(--ember);border-color:var(--ember)}
.path.rest .sig{color:var(--jade)}.path.shop .sig,.path.shrine .sig{color:var(--gold)}
.relics{display:flex;gap:6px;flex-wrap:wrap}
.actrow{display:flex;gap:6px;flex-wrap:wrap}
.shop{gap:14px}
.stall{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);line-height:0}
.merch{width:100%;height:auto;display:block}
.merch .flick{animation:flicker 2.2s ease-in-out infinite}
.m-body{animation:mbob 3s ease-in-out infinite;transform-origin:150px 150px}
.m-fan{transform-box:view-box;transform-origin:198px 88px;animation:fan 1.6s ease-in-out infinite}
@keyframes mbob{50%{transform:translateY(1.5px) scale(1.01,.99)}}
@keyframes fan{50%{transform:rotate(-14deg)}}
.bubble{position:absolute;left:10px;top:30%;max-width:38%;background:var(--washi);color:#221f28;border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.35;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.bubble::after{content:"";position:absolute;right:-8px;top:14px;border:6px solid transparent;border-left:9px solid var(--washi);border-right:0}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.purse{position:absolute;right:8px;top:8px;line-height:1.2;background:#0f1016d9;border:1px solid #6f5418;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--dim)}.purse b{color:var(--gold);font-variant-numeric:tabular-nums}
.ssec{display:flex;flex-direction:column;gap:8px}
.shopcards{justify-content:flex-start;gap:10px}
.cwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.cwrap .card{flex:0 0 auto;width:min(108px,28vw)}
.cwrap.sold .card{opacity:.3;filter:grayscale(1)}
.tag{font-size:13px;font-weight:700;color:var(--gold);background:#2e2614;border:1px solid #6f5418;border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag small{font-weight:400;font-size:11px}
.tag.poor{color:#ff7a6e;border-color:#6e2a26;background:#2a1414}
.tag.sold{color:var(--dim);border-color:var(--line2);background:var(--paper2)}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.srow:hover:not(:disabled){border-color:var(--gold)}
.srow .sig{flex:0 0 40px;height:40px;font-size:20px}
.srow .st{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.srow .st b{font-size:14px}.srow .st small{font-size:12px;color:var(--dim);line-height:1.35}
.srow.poor{opacity:.75}.srow.sold{opacity:.4}
.srow:disabled{cursor:not-allowed}
.mapsvg #rider{pointer-events:none}
#rider .lg{transform-box:fill-box;transform-origin:50% 0}
#rider .tail{transform-box:fill-box;transform-origin:100% 0;animation:tailsw 2.6s ease-in-out infinite}
#rider .scf{transform-box:fill-box;transform-origin:100% 0;animation:tailsw 1.4s ease-in-out infinite}
#rider.gallop .lgA{animation:legA .3s linear infinite}#rider.gallop .lgB{animation:legB .3s linear infinite}
#rider.gallop .horse,#rider.gallop .rdr{animation:gbob .3s ease-in-out infinite}
#rider.gallop .tail{animation:tailsw .3s ease-in-out infinite}
@keyframes legA{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-30deg)}}
@keyframes legB{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
@keyframes gbob{50%{transform:translateY(-1.8px)}}
@keyframes tailsw{50%{transform:rotate(-12deg)}}
.mlab{font-size:8.5px;fill:#9a96a8;text-anchor:middle;font-family:var(--f-body)}
.mnode.avail .mlab{fill:#ece6d7;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend svg{flex:0 0 auto}
.mapinfo .sig{flex:0 0 52px;height:52px;display:grid;place-items:center}
.setin{max-width:440px;flex:0 1 auto!important;margin-top:8vh!important}
.setp{gap:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.setrow span{display:flex;flex-direction:column;gap:2px}.setrow small{font-size:12px;color:var(--dim)}
.slide{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}.slide:last-of-type{border-bottom:0}
.slide input{flex:1;min-width:0;accent-color:var(--gold);height:28px}.slide input:disabled{opacity:.35}
.slide output{width:40px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--gold)}
.sw{flex:0 0 46px;height:28px;border-radius:999px;border:1px solid var(--line2);background:var(--paper2);position:relative;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .18s}
.sw.on{background:#6f5418;border-color:var(--gold)}.sw.on i{transform:translateX(18px);background:var(--gold)}
.btn.mus{color:var(--dim);text-decoration:line-through;padding:6px 9px}.btn.mus.on{text-decoration:none}.btn.mus.on{color:var(--gold);border-color:#6f5418}
.bg{position:absolute;z-index:-1;top:-6px;bottom:-4px;left:0;right:0;border-radius:12px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(#000 0,#000 86%,transparent);mask-image:linear-gradient(#000 0,#000 86%,transparent)}
.bg>svg{position:absolute;inset:0;width:100%;height:100%}
.bg .mist{animation:mist 22s ease-in-out infinite alternate}.bg .mist2{animation:mist 30s ease-in-out infinite alternate-reverse}
@keyframes mist{to{transform:translateX(-60px)}}
.bg .ptl{position:absolute;top:-10px;display:block;animation:fall linear infinite}
.bg .emb{position:absolute;bottom:4%;display:block;border-radius:50%;animation:rise linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(-70px,420px) rotate(540deg)}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(30px,-360px);opacity:0}}
.bg .flick{animation:flicker 2.2s ease-in-out infinite}
.stage .foe .nm,.stage .foe .nums,.stage .hero .nm{text-shadow:0 1px 3px #000,0 0 8px #000}
.stage .foe .nm{color:#d8d3e3}
.pick{gap:12px}
.clsrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ctab{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:1.5px solid var(--line2);border-radius:12px;padding:8px 4px 8px}
.ctab .pic{width:54px;line-height:0}.ctab .pic svg{width:100%;height:auto;overflow:visible}
.ctab b{font-size:14px}.ctab small{font-size:11px;color:var(--dim)}
.ctab.on{border-color:var(--gold);background:var(--paper2)}
.blist{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.brow.on{border-color:var(--gold);background:var(--paper2)}
.rad{flex:0 0 16px;height:16px;border-radius:50%;border:2px solid var(--line2);margin-top:2px}
.brow.on .rad{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--paper2);background:var(--gold)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.bt b{font-size:14px}.bt small{font-size:12px;color:var(--dim);line-height:1.35}
.sigs{display:flex;flex-wrap:wrap;gap:4px}.sigs i{font-style:normal;font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--gold)}
.tp{font-size:11px;color:var(--dim);white-space:nowrap}
.pickbar{position:sticky;bottom:0;display:flex;gap:8px;background:var(--ink);padding-block:8px}
.pickbar .main{flex:1}
.ascrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #ffffff1f;border-radius:10px;background:#14151d}
.ascrow.on{border-color:#c0392b;background:linear-gradient(90deg,#2a1214,#14151d)}
.ascrow .ab{flex:0 0 34px;height:34px;border-radius:8px;border:1px solid #ffffff2a;background:#1d1f2a;color:var(--washi);font-size:20px;line-height:1;cursor:pointer}
.ascrow .ab:disabled{opacity:.3;cursor:default}
.ascrow .at{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ascrow .at b{font-size:14px;display:flex;justify-content:space-between;gap:6px}
.ascrow.on .at b{color:#ff8a7a}
.ascrow .at b i{font-style:normal;font-weight:400;font-size:11px;color:var(--muted,#9a9aa8)}
.ascrow .at small{font-size:12px;color:var(--muted,#9a9aa8);line-height:1.3}
.ascb{color:#ff8a7a}
.ember.ascup span{color:#ff8a7a}
.relic.perk{color:var(--jade);border-color:#2f5a4d}
.kit{display:flex;flex-direction:column;gap:6px;text-align:left;background:none;border:0;padding:0}
.kitlist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px}.kitlist p{margin:0}
.kitlist .pk{color:var(--jade)}.kitlist .rl{color:var(--gold)}
.perkrow h3{font-size:15px}
.builds{display:grid;gap:10px}
.build{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:14px}
.build:hover{border-color:var(--gold)}
.build .label{color:var(--gold);font-size:13px}
.cards.mini{justify-content:flex-start;gap:8px}.cards.mini .card{flex:0 0 104px;pointer-events:none}
.tpips{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim)}.tpips i{width:18px;height:4px;border-radius:2px;background:var(--line2)}.tpips i.on{background:var(--gold)}.tpips span{margin-left:6px}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{flex:1;background:none;border:0;border-radius:7px;padding:8px;font-weight:500;color:var(--dim)}.tab.on{background:var(--paper2);color:var(--washi)}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.branch{display:flex;flex-direction:column;align-items:stretch}
.bname{font-family:var(--f-disp);font-weight:800;font-size:13px;text-align:center;color:var(--gold);margin-bottom:8px;min-height:2.4em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.tlink{display:block;width:2px;height:14px;background:var(--line2);margin:0 auto}
.tnode{display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;background:var(--paper);border:1.5px solid var(--line2);border-radius:10px;padding:10px 4px;min-height:64px;justify-content:center}
.tnode .tn{font-size:12px;font-weight:700;line-height:1.2}.tnode .tc{font-size:11px;color:var(--dim)}
.tnode.own{border-color:var(--gold);background:#2e2614}.tnode.own .tc{color:var(--gold)}
.tnode.open{border-color:var(--indigo)}
.tnode.lock{opacity:.45}
.tnode.sel{box-shadow:0 0 0 2px var(--washi)}
.mapwrap{border:1px solid var(--line);border-radius:12px;background:#101118;overflow:hidden}
.mapsvg{width:100%;height:auto;display:block}
.mnode{cursor:pointer;outline:none}.mnode:focus-visible circle:not(.ring){stroke:#ece6d7;stroke-width:3}
.mnode .ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
.you{animation:bob 2.4s ease-in-out infinite}
.mapinfo{position:sticky;bottom:0;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 24px #0f1016}
.mapinfo .btn.main{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim)}
.legend b{font-family:var(--f-disp);font-size:14px;margin-right:2px}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.cls{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:14px;min-width:0}
.cls:hover{border-color:var(--gold)}
.cls .pic{width:96px;line-height:0;align-self:center}.cls .pic svg{width:100%;height:auto;overflow:visible}
@media (max-width:520px){.cls{display:grid;grid-template-columns:80px 1fr;column-gap:12px}.cls .pic{grid-row:span 5;width:80px}.cls .chips{grid-column:1/-1}}

@keyframes ward{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.15)}}

   ${(document.fullscreenEnabled||document.webkitFullscreenEnabled)?`<div class="setrow"><span><b>Fullscreen</b><small>Hide the browser bars. Turn your phone sideways for the wide layout.</small></span>${sw('fullscreen',!!(document.fullscreenElement||document.webkitFullscreenElement),'Fullscreen')}</div>`:''}

function renderDeck(){

  if(G.statusOpen&&G.C){const c=G.C,r=G.run,rows=[];

    rows.push(['毒 Enemy poison','Poisoned enemies lose that much HP at the start of their turn, then poison drops by 1.']);
    rows.push(['◆ Enemy block and strength','Enemy block soaks your damage. Enemy strength adds to every hit of their attacks.']);
    ov.hidden=false;ov.className='overlay';ov.innerHTML=`<div class="in setin"><div class="row" style="justify-content:space-between"><h2>Status effects</h2><button class="btn sm" data-a="statusClose">Close</button></div><div class="panel stlist">${rows.map(([a,b])=>`<p><b>${a}</b><span>${b}</span></p>`).join('')}</div><p class="help">${CLS().help(c)}</p></div>`;return}
  if(G.itemOpen!=null&&G.run&&G.run.items&&G.run.items[G.itemOpen]){ov.hidden=false;ov.className='overlay';ov.innerHTML=itemPopHTML();return}if(G.itemOpen!=null)G.itemOpen=null;if(G.setOpen){ov.hidden=false;ov.className='overlay';ov.innerHTML=settingsHTML();return}if(!G.deckOpen||!G.run){ov.hidden=true;ov.innerHTML='';return}
  const counts={};G.run.deck.forEach(k=>counts[k]=(counts[k]||0)+1);
  ov.hidden=false;ov.className='overlay';

  <div class="scroll"><div class="kitlist">${(G.run.perks||[]).map(k=>`<p><b class="pk">${PERKS[k].n}</b> <span class="muted">Perk. ${PERKS[k].x}</span></p>`).join('')}${G.run.relics.map(k=>`<p><b class="rl">${RELICS[k].n}</b> <span class="muted">Relic. ${RELICS[k].x}</span></p>`).join('')}</div><div class="cards">${Object.keys(counts).map(k=>cardHTML(k,'tabindex="-1"',false,`<span class="price">× ${counts[k]}</span>`)).join('')}</div></div></div>`;
}
function save(){const {deckOpen,busy,...rest}=G;return rest}

['pointerdown','touchend','click','keydown'].forEach(t=>document.addEventListener(t,audioUnlock,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(!MUS.ctx)return;if(document.hidden)MUS.ctx.suspend();else if(MUS.on||SFX.on)MUS.ctx.resume()});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v,r=G.run;
  switch(a){
    case'new':G.screen='pick';G.deckOpen=false;render();break;
    case'pcls':G.pickCls=v;G.pickBuild=null;G.pickAsc=null;render();break;
    case'ascSel':{const k=G.pickCls||'samurai',top=META.asc[k]||0,cur=Math.min(G.pickAsc??top,top);G.pickAsc=Math.max(0,Math.min(top,cur+(+v)));render();break}
    case'pbuild':G.pickBuild=v;render();break;
    case'startrun':{const k=G.pickCls||'samurai',b=G.pickBuild&&BUILDS[k][G.pickBuild]?G.pickBuild:Object.keys(BUILDS[k])[0];{const top=META.asc[k]||0;newRun(k,b,Math.min(G.pickAsc??top,top))}break}
    case'sfx':SFX.on=!SFX.on;ls('lr-sfx',SFX.on?'on':'off');if(SFX.on){audioUnlock();setTimeout(()=>sfx('slice'),30)}render();break;
    case'fullscreen':{const d=document.documentElement,on=document.fullscreenElement||document.webkitFullscreenElement;
      try{if(on){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}}catch(e){}
      setTimeout(renderDeck,300);break}
    case'settings':G.setOpen=!G.setOpen;renderDeck();bar();break;
    case'tips':G.tips=!G.tips;ls('lr-tips',G.tips?'on':'off');if(!G.tips){const k=document.getElementById('kw2');if(k)k.hidden=true}if(G.setOpen)renderDeck();{const b=document.querySelector('.tipbtn');if(b){b.classList.toggle('on',G.tips);b.textContent=G.tips?'Tips on':'Tips off';b.setAttribute('aria-pressed',G.tips)}}if(G.tips&&G.selCard!=null)showKW(G.selCard);break;
    case'music':MUS.on=!MUS.on;ls('lr-music',MUS.on?'on':'off');if(MUS.on)musStart();else musStop();render();break;
    case'motion':G.motion=G.motion==='reduced'?'full':'reduced';ls('lr-motion',G.motion);document.documentElement.classList.toggle('calm',G.motion==='reduced');render();break;
    case'takePerk':if(G.reward&&!G.reward.perk){G.reward.perk=v;gainPerk(v)}render();break;
    case'buyPerk':{const x=G.shop.perks[+v];if(x&&!x.sold&&r.gold>=x.p){r.gold-=x.p;x.sold=1;gainPerk(x.k);G.shop.say=pick(SAY.buy);sfx('coin')}render();break}
    case'talents':G.tcls=(G.run&&G.run.cls)||G.tcls||'samurai';G.tsel=null;G.screen='talents';render();break;
    case'tcls':G.tcls=v;G.tsel=null;render();break;
    case'tsel':G.tsel=v;render();break;
    case'learn':{const k=G.tcls,o=Object.entries(TALENTS[k]).flatMap(([b,l])=>l.map((t,i)=>({b,i,t}))).find(o=>o.t[0]===v);if(o&&!META.t[k].includes(v)&&(o.i===0||META.t[k].includes(TALENTS[k][o.b][o.i-1][0]))&&META.pts>=TCOST[o.i]){META.pts-=TCOST[o.i];META.t[k].push(v);saveMeta()}render();break}
    case'treset':{const k=G.tcls;Object.values(TALENTS[k]).forEach(l=>l.forEach((t,i)=>{if(META.t[k].includes(t[0]))META.pts+=TCOST[i]}));META.t[k]=[];saveMeta();render();break}
    case'title':G.screen='title';render();break;
    case'resume':try{Object.assign(G,JSON.parse(ls('lr-run')));G.busy=false;fixRun();render()}catch(x){newRun()}break;
    case'deck':G.deckOpen=!G.deckOpen;renderDeck();break;
    case'node':if(G.traveling)break;G.sel=v;render();break;
    case'travel':travel(v);break;
    case'tgt':if(G.busy)break;if(G.selCard!=null&&C().hand[G.selCard]&&isTgt(C().hand[G.selCard])){C().tgt=+v;play(G.selCard);break}C().tgt=+v;render();break;
    case'play':play(+v);break;
    case'end':endTurn();break;
    case'take':r.deck.push(v);if(G.reward&&G.reward.boss){G.reward.card=v;render()}else nextFloor();break;
    case'skip':if(G.reward&&G.reward.boss){G.reward.card='skip';render()}else nextFloor();break;
    case'bossRelic':if(!G.reward.relic){G.reward.relic=v;gainRelic(v)}render();break;
    case'nextAct':advanceAct();break;
    case'rest':heal(Math.round(r.maxHp*restPct()));nextFloor();break;
    case'trim':G.removeFrom='rest';G.screen='remove';render();break;
    case'shopTrim':G.removeFrom='shop';G.screen='remove';render();break;
    case'boon':{const b=G.boon;if(!b||b.pick)break;b.pick=v;b.say=pick(MIKO.bye);sfx('chime');const res=BOONS[v].f();if(res===null){render();break}b.result=res;render();break}
    case'pile':G.pileOpen=v;renderDeck();break;
    case'pileClose':G.pileOpen=null;renderDeck();break;
    case'status':G.statusOpen=1;renderDeck();break;
    case'statusClose':G.statusOpen=0;renderDeck();break;
    case'item':G.itemOpen=+v;renderDeck();break;
    case'itemClose':G.itemOpen=null;renderDeck();break;
    case'useItem':if(G.itemOpen!=null)useItem(G.itemOpen);break;
    case'dropItem':if(G.itemOpen!=null){G.run.items.splice(G.itemOpen,1);G.itemOpen=null;renderDeck();render()}break;
    case'takeItem':{const w=G.reward;if(w&&w.item&&!w.itemTaken&&gainItem(w.item)){w.itemTaken=1;sfx('coin')}render();break}
    case'buyItem':{const x=G.shop.items[+v];if(x&&!x.sold&&r.gold>=x.p&&gainItem(x.k)){r.gold-=x.p;x.sold=1;G.shop.say=pick(SAY.buy);sfx('coin')}render();break}
    case'boonGo':G.boon=null;nextFloor();break;
    case'cancelRemove':if(G.removeFrom==='boon'){G.boon.pick=null;G.screen='boon';render();break}G.screen=G.removeFrom;render();break;
    case'remove':if(G.removeFrom==='boon'){const k=r.deck[+v];r.deck.splice(+v,1);G.boon.result=`${CARDS[k].n} burns away in the purifying flame.`;G.screen='boon';sfx('death');render();break}if(G.removeFrom==='shop'){const p=rmPrice(G.shop);if(r.gold<p)break;r.deck.splice(+v,1);r.gold-=p;G.shop.removed=(+G.shop.removed||0)+1;G.shop.say=pick(SAY.rm);sfx('death');G.screen='shop';render()}else{r.deck.splice(+v,1);nextFloor()}break;
    case'evt':G.ev.result=EVENTS[G.ev.i].o[+v].f();{const c=EVC[EVENTS[G.ev.i].n];if(c)G.ev.say=c.bye}render();break;
    case'buy':{const x=G.shop.cards[+v];if(x&&!x.sold&&r.gold>=x.p){r.gold-=x.p;x.sold=1;r.deck.push(x.k);G.shop.say=pick(SAY.buy);sfx('coin')}render();break}
    case'tea':{const sh=G.shop;if(!sh.tea&&r.gold>=(sh.tp||30)){r.gold-=sh.tp||30;sh.tea=1;heal(15);sh.say=pick(SAY.tea);sfx('chime')}render();break}
    case'buyRelic':{const x=G.shop.relics[+v];if(x&&!x.sold&&r.gold>=x.p){r.gold-=x.p;x.sold=1;gainRelic(x.k);G.shop.say=pick(SAY.buy);sfx('coin')}render();break}
    case'next':nextFloor();break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='vol-music'){MUS.vol=t.value/100;ls('lr-mvol',String(t.value));const o=document.getElementById('vm-out');if(o)o.textContent=t.value+'%';if(MUS.master)MUS.master.gain.setTargetAtTime(.5*MUS.vol,MUS.ctx.currentTime,.05);bar()}

document.addEventListener('change',e=>{if(e.target.id==='vol-sfx')sfx('slice')});

function fixRun(){const r=G.run;if(r&&!r.items)r.items=[];if(r&&!r.bossPick)r.bossPick=ACTS.map(a=>a.boss);if(r&&!r.perks)r.perks=[];if(r&&!r.cls)r.cls='samurai';if(r&&!r.build)r.build=Object.keys(BUILDS[r.cls])[0];if(r&&!r.act){r.act=1;r.floor=Math.min(r.floor,FPA-1)}if(r&&!r.map){const f=r.floor;genMap();if(f>=1){const k=Math.min(f,FPA-1)-1;r.pos={r:k,c:0};r.path=Array.from({length:k+1},(_,i)=>i+','+0);for(let i=0;i<k;i++)if(!r.map.edges[i+',0'].includes(0))r.map.edges[i+',0'].push(0)}r.floor=Math.min(f,FPA-1)}if(G.C&&!G.C.emax)G.C.emax=3}
try{document.documentElement.classList.toggle('calm',G.motion==='reduced')}catch(e){}
function start(data){if(data&&data.G){Object.assign(G,data.G);G.busy=false;fixRun()}render()}
